<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Photo Editor</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    h1 {
      margin-bottom: 20px;
      color: #38bdf8;
      font-size: 2rem;
    }

    .container {
      background-color: #1e293b;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .api-key-box {
      background-color: #0f172a;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #3b82f6;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .api-key-box label {
      font-size: 0.85rem;
      color: #94a3b8;
    }

    .api-key-box input {
      background: #1e293b;
      border: 1px solid #475569;
      color: #fff;
      padding: 8px 12px;
      border-radius: 6px;
      outline: none;
    }

    .file-input-wrapper {
      text-align: center;
    }

    input[type="file"] {
      display: none;
    }

    .custom-file-upload {
      background-color: #3b82f6;
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      display: inline-block;
      transition: 0.3s;
    }

    .custom-file-upload:hover {
      background-color: #2563eb;
    }

    .tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
    }

    .tool-btn {
      background-color: #334155;
      color: #f8fafc;
      border: 1px solid #475569;
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      transition: 0.3s;
    }

    .tool-btn:hover {
      background-color: #38bdf8;
      color: #0f172a;
      border-color: #38bdf8;
    }

    .btn-ai {
      background-color: #8b5cf6;
      border-color: #a855f7;
    }

    .btn-ai:hover {
      background-color: #a855f7;
      color: #fff;
    }

    .preview-section {
      background-color: #0f172a;
      border: 2px dashed #475569;
      border-radius: 8px;
      min-height: 350px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
      /* Checkerboard pattern for transparent BG */
      background-image: linear-gradient(45deg, #1e293b 25%, transparent 25%), linear-gradient(-45deg, #1e293b 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #1e293b 75%), linear-gradient(-45deg, transparent 75%, #1e293b 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
    }

    .preview-section img {
      max-width: 100%;
      max-height: 450px;
      object-fit: contain;
      transition: filter 0.3s ease;
    }

    .placeholder-text {
      color: #94a3b8;
    }

    .loading-text {
      position: absolute;
      background: rgba(0, 0, 0, 0.8);
      color: #38bdf8;
      padding: 15px 25px;
      border-radius: 8px;
      font-weight: bold;
      display: none;
    }

    .download-btn {
      background-color: #10b981;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      text-align: center;
    }

    .download-btn:hover {
      background-color: #059669;
    }

    .download-btn:disabled {
      background-color: #475569;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <h1>✨ AI Photo Editor</h1>

  <div class="container">
    <!-- API Key Input -->
    <div class="api-key-box">
      <label for="apiKey">🔑 Free Remove.bg API Key paste karein:</label>
      <input type="password" id="apiKey" placeholder="Yahan API Key daalein...">
    </div>

    <!-- File Input -->
    <div class="file-input-wrapper">
      <label for="imageLoader" class="custom-file-upload">
        📁 Choose File
      </label>
      <input type="file" id="imageLoader" accept="image/*">
    </div>

    <!-- Editing Tools -->
    <div class="tools-grid">
      <button class="tool-btn btn-ai" onclick="removeBackgroundAI()">✨ Remove BG (AI)</button>
      <button class="tool-btn" onclick="applyEffect('enhance')">Enhance Photo</button>
      <button class="tool-btn" onclick="applyEffect('faceEnhance')">Face Enhance</button>
      <button class="tool-btn" onclick="applyEffect('colorFix')">Color Fix</button>
      <button class="tool-btn" onclick="applyEffect('upscale')">4K Upscale</button>
      <button class="tool-btn" onclick="resetImage()">Reset</button>
    </div>

    <!-- Preview Area -->
    <div class="preview-section">
      <span class="placeholder-text" id="placeholder">Upload an image to see Preview</span>
      <div class="loading-text" id="loading">⏳ Background Remove ho raha hai...</div>
      <img id="imagePreview" src="" alt="Preview" style="display: none;">
    </div>

    <!-- Download Button -->
    <button class="download-btn" id="downloadBtn" onclick="downloadImage()" disabled>
      ⬇️ Download HD
    </button>
  </div>

  <script>
    const imageLoader = document.getElementById('imageLoader');
    const imagePreview = document.getElementById('imagePreview');
    const placeholder = document.getElementById('placeholder');
    const downloadBtn = document.getElementById('downloadBtn');
    const loading = document.getElementById('loading');

    let originalFile = null;
    let originalImageSrc = "";

    // Image Upload
    imageLoader.addEventListener('change', function(e) {
      if(e.target.files[0]){
        originalFile = e.target.files[0];
        const reader = new FileReader();
        reader.onload = function(event) {
          imagePreview.src = event.target.result;
          originalImageSrc = event.target.result;
          imagePreview.style.display = 'block';
          placeholder.style.display = 'none';
          downloadBtn.disabled = false;
          resetEffects();
        }
        reader.readAsDataURL(originalFile);
      }
    });

    // Real AI Background Removal Function
    async function removeBackgroundAI() {
      const apiKey = document.getElementById('apiKey').value.trim();
      
      if (!originalFile) {
        alert("Pehle koi photo choose karein!");
        return;
      }
      
      if (!apiKey) {
        alert("Kripya pehle apni Remove.bg API key daalein!\n(Yeh free me milti hai)");
        return;
      }

      loading.style.display = 'block';

      const formData = new FormData();
      formData.append('image_file', originalFile);
      formData.append('size', 'auto');

      try {
        const response = await fetch('https://api.remove.bg/v1.0/removebg', {
          method: 'POST',
          headers: {
            'X-Api-Key': apiKey,
          },
          body: formData
        });

        if (response.ok) {
          const blob = await response.blob();
          const newUrl = URL.createObjectURL(blob);
          imagePreview.src = newUrl;
          resetEffects();
          alert("Success: Background remove ho gaya!");
        } else {
          const errorData = await response.json();
          alert("Error: " + (errorData.errors[0].title || "API Key galat hai ya limit khatam ho gayi hai!"));
        }
      } catch (error) {
        alert("Network Error: Connectivity check karein!");
      } finally {
        loading.style.display = 'none';
      }
    }

    // Standard Filter Effects
    function resetEffects() {
      imagePreview.style.filter = 'none';
      imagePreview.style.transform = 'scale(1)';
    }

    function resetImage() {
      if(originalImageSrc) {
        imagePreview.src = originalImageSrc;
        resetEffects();
      }
    }

    function applyEffect(effect) {
      if (!imagePreview.src || imagePreview.style.display === 'none') {
        alert('Pehle photo upload karein!');
        return;
      }

      resetEffects();

      switch(effect) {
        case 'enhance':
          imagePreview.style.filter = 'contrast(125%) brightness(110%) saturate(120%)';
          break;
        case 'faceEnhance':
          imagePreview.style.filter = 'brightness(115%) blur(0.2px) contrast(105%)';
          break;
        case 'colorFix':
          imagePreview.style.filter = 'saturate(160%) hue-rotate(10deg)';
          break;
        case 'upscale':
          imagePreview.style.filter = 'contrast(110%) sharpen(100%)';
          imagePreview.style.transform = 'scale(1.02)';
          break;
      }
    }

    // Download Function
    function downloadImage() {
      const a = document.createElement('a');
      a.href = imagePreview.src;
      a.download = 'ai-edited-photo.png';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }
  </script>

</body>
</html>
